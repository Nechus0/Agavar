# Downloads microscope photos of every germ from Wikipedia / Wikimedia Commons (with author and
# licence) and commits them, so the atlas shows real pictures. Start it by hand under
# Actions → "Fetch germ photos" → Run workflow, e.g. after adding new germs.
name: Fetch germ photos
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Fetch every photo again (otherwise only missing ones)
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/fetch-germ-photos.mjs
        env:
          FORCE: ${{ inputs.refresh && '1' || '0' }}
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A img/germs js/germ-photos.js
          git diff --cached --quiet || git commit -m "Atlas: germ photos from Wikimedia Commons"
          git push
